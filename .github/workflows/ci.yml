name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Токен GitHub в этом конвейере только читает код. Job, которым нужно больше (публикация отчётов
# на GitHub Pages), просят права сами — так чужой код из зависимостей не сможет ничего изменить в репозитории
permissions:
  contents: read

jobs:
  test:
    name: Типы, линтер, тесты на PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kassa
          POSTGRES_PASSWORD: kassa
          POSTGRES_DB: kassa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kassa" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Уязвимости в зависимостях (npm audit)
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Миграции совпадают со схемой
        run: npx drizzle-kit generate --name ci-check && git diff --exit-code drizzle/
      - name: Тесты (юнит, гонки на PostgreSQL, API) с порогом покрытия
        run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=html
      - run: npm run build
      - name: Собрать Allure-отчёт и положить рядом отчёт о покрытии
        if: always()
        run: |
          npx --yes allure-commandline@2 generate allure-results --clean -o site
          cp -r coverage site/coverage || true
      - name: Подготовить отчёты к публикации на GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  report:
    name: Опубликовать отчёты на GitHub Pages
    needs: test
    if: always() && github.ref == 'refs/heads/main' && needs.test.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  docker:
    name: Docker-образ — сборка и смоук всего сценария покупки
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --wait
      - name: Смоук — бронь, заказ, оплата через учебный шлюз и вебхук
        run: sh scripts/smoke.sh http://localhost:3000
      - if: failure()
        run: docker compose logs
