# Blueprint для Render: New → Blueprint → этот репозиторий. База — Neon (бесплатная база Render живёт 30 дней).
services:
  - type: web
    name: kassa-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: 'true'
      # Адрес клиента для лимитов (src/lib/client-ip.ts). Render стоит за Cloudflare:
      # True-Client-IP ставит Cloudflare, X-Forwarded-For — «…, клиент, Cloudflare»
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      - key: PROXY_HOPS
        value: '2'
