# Blueprint для Render: New → Blueprint → этот репозиторий. База — Neon (бесплатная база Render живёт 30 дней).
services:
  - type: web
    name: kassa-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: 'true'
      # Адрес клиента для лимитов (PROXY_HOPS, CLIENT_IP_HEADER) на Render включается сам —
      # по переменной RENDER=true, которую Render задаёт каждому сервису (src/config.ts)
